version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
        - npx prisma generate
        # Materialize env vars into .env.production. sed escapes every `$` to
        # `\$` because Next.js's dotenv-expand treats `$XX` as variable
        # interpolation — bcrypt hashes (`$2b$12$...`) would otherwise be
        # mangled to a trailing `.` at runtime.
        - |
          env | grep -E '^(DATABASE_URL|ADMIN_EMAILS|ADMIN_PASSWORD_HASH_[A-Z]+|ADMIN_JWT_SECRET|RESEND_API_KEY|EMAIL_FROM|BREVO_API_KEY|CRON_SECRET|UNSUBSCRIBE_SECRET|NEXT_PUBLIC_APP_URL|NEXT_PUBLIC_ADMIN_URL|POPPY_BASE_URL|INTERNAL_SECRET|BACKEND_URL|INTERNAL_API_SECRET|AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY|AWS_REGION|POPPY_S3_REGION|S3_BUCKET|S3_ENDPOINT|POPPY_S3_BUCKET_GENERATED|POPPY_S3_BUCKET_REELS|CLOUDFRONT_URL)=' | sed 's/\$/\\$/g' >> .env.production
        - |
          {
            echo "AWS_ACCESS_KEY_ID=${POPPY_AWS_ACCESS_KEY_ID}"
            echo "AWS_SECRET_ACCESS_KEY=${POPPY_AWS_SECRET_ACCESS_KEY}"
            echo "AWS_REGION=${POPPY_AWS_REGION}"
            echo "AWS_CREDIT_TOTAL=${POPPY_AWS_CREDIT_TOTAL}"
          } | sed 's/\$/\\$/g' >> .env.production
    build:
      commands:
        # Clear stale webpack cache to prevent serving old bundled chunks.
        - rm -rf .next/cache
        # Use webpack instead of Turbopack — Turbopack auto-externalizes
        # packages with native .node binaries (like Prisma), creating hashed
        # module names that can't be resolved in Lambda at runtime.
        - npx next build --webpack
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
