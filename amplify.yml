version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
        - npx prisma generate
        - |
          env | grep -E '^(DATABASE_URL|ADMIN_EMAILS|ADMIN_PASSWORD_HASH_[A-Z]+|ADMIN_JWT_SECRET|RESEND_API_KEY|EMAIL_FROM|VESSPR_APP_URL|PELLOW_BASE_URL|INTERNAL_SECRET)=' >> .env.production
        - |
          {
            echo "AWS_ACCESS_KEY_ID=${VESSPR_AWS_ACCESS_KEY_ID}"
            echo "AWS_SECRET_ACCESS_KEY=${VESSPR_AWS_SECRET_ACCESS_KEY}"
            echo "AWS_REGION=${VESSPR_AWS_REGION}"
            echo "AWS_CREDIT_TOTAL=${VESSPR_AWS_CREDIT_TOTAL}"
          } >> .env.production
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
